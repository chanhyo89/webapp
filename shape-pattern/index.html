<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>모양 규칙 찾기</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
/* 레이아웃: 위에서 아래로 항상 같은 순서 — [진행 별 · 소리] → [지금 할 일] → [모양 줄] → [고르기 2개] → [피드백/다음]. 위치가 바뀌지 않는다. */
:root {
  --bg: #F3F6F8;
  --surface: #FFFFFF;
  --ink: #1F2A33;
  --muted: #5C6B77;
  --line: #D5DEE5;
  --focus: #2A7A6F;
  --ok: #2A7A6F;
  --ok-soft: #DDF0EC;
  --hint: #FFF4D6;
  --circle: #D64545;
  --square: #2E66CC;
  --tri: #D99A00;
  --star: #E5A800;
  --star-empty: #DCE3E9;
  --font-display: "Jua", "Noto Sans KR", system-ui, sans-serif;
  --font-body: "Noto Sans KR", system-ui, -apple-system, "Apple SD Gothic Neo", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #161C21; --surface: #20282F; --ink: #EEF2F5; --muted: #A3B0BA; --line: #34404A;
    --focus: #6CC7B8; --ok: #6CC7B8; --ok-soft: #1E3A36; --hint: #3A3320;
    --circle: #F07070; --square: #6E9CF0; --tri: #F2BE3A; --star: #F2BE3A; --star-empty: #34404A;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #161C21; --surface: #20282F; --ink: #EEF2F5; --muted: #A3B0BA; --line: #34404A;
  --focus: #6CC7B8; --ok: #6CC7B8; --ok-soft: #1E3A36; --hint: #3A3320;
  --circle: #F07070; --square: #6E9CF0; --tri: #F2BE3A; --star: #F2BE3A; --star-empty: #34404A;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 18px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.app { max-width: 960px; margin: 0 auto; padding-block: 20px 32px; display: flex; flex-direction: column; gap: 20px; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible { outline: 4px solid var(--focus); outline-offset: 3px; }

/* 상단 바 */
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.stars { display: flex; gap: 8px; align-items: center; }
.stars svg { width: 44px; height: 44px; }
.stars .lbl { font-size: 15px; color: var(--muted); margin-right: 4px; }
.sound { display: flex; align-items: center; gap: 8px; padding: 10px 16px; border-radius: 12px; border: 2px solid var(--line); background: var(--surface); font-size: 17px; }
.sound svg { width: 24px; height: 24px; }
.sound[aria-pressed="true"] { border-color: var(--ok); background: var(--ok-soft); }

/* 지금 할 일 */
.task { display: flex; align-items: center; gap: 16px; background: var(--surface); border: 2px solid var(--line); border-radius: 16px; padding: 14px 20px; }
.task .now { font-size: 14px; font-weight: 700; letter-spacing: .04em; color: var(--surface); background: var(--ink); border-radius: 8px; padding: 4px 10px; white-space: nowrap; }
.task .say { font-family: var(--font-display); font-size: clamp(26px, 4vw, 36px); line-height: 1.2; }
.task svg { width: 44px; height: 44px; flex: none; }

/* 모양 줄 */
.seq-wrap { background: var(--surface); border-radius: 20px; padding: 24px 16px; display: flex; flex-direction: column; align-items: center; gap: 16px; }
.seq { display: flex; gap: clamp(4px, 1vw, 12px); justify-content: center; flex-wrap: nowrap; width: 100%; }
.cell { flex: 1 1 0; min-width: 0; max-width: 110px; aspect-ratio: 1; border-radius: 14px; display: grid; place-items: center; border: 3px solid transparent; }
.cell.unit-start { margin-left: clamp(8px, 2.4vw, 28px); }
.cell.q { font-size: clamp(24px, 6vw, 60px); }
.cell svg { width: 78%; height: 78%; }
.cell.q { border: 4px dashed var(--muted); font-family: var(--font-display); color: var(--muted); }
.rule { display: flex; align-items: center; gap: 8px; font-size: 16px; color: var(--muted); }
.rule .mini { display: inline-flex; gap: 3px; }
.rule .mini svg { width: 26px; height: 26px; }
.rules { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; width: 100%; max-width: 720px; }
.ruleBtn { background: var(--surface); border: 3px solid var(--line); border-radius: 16px; padding: 14px 8px; display: flex; flex-direction: column; align-items: center; gap: 8px; }
.ruleBtn[aria-pressed="true"] { border-color: var(--ok); background: var(--ok-soft); }
.ruleBtn .mini { display: flex; gap: 3px; }
.ruleBtn .mini svg { width: 22px; height: 22px; }
.ruleBtn .nm { font-family: var(--font-display); font-size: 22px; }
.ruleBtn .ds { font-size: 13px; color: var(--muted); }
.pickLbl { font-size: 15px; color: var(--muted); }
@media (max-width: 600px) { .rules { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.cell.q.filled { border-style: solid; border-color: var(--ok); background: var(--ok-soft); }
.cell.lit { border-color: var(--focus); background: var(--hint); }
.read { display: flex; align-items: center; gap: 8px; background: transparent; border: 2px solid var(--line); border-radius: 12px; padding: 8px 16px; font-size: 16px; color: var(--muted); }
.read svg { width: 22px; height: 22px; }

/* 고르기 */
.choices { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px; }
.choice { background: var(--surface); border: 4px solid var(--line); border-radius: 22px; padding: 18px 12px; display: flex; flex-direction: column; align-items: center; gap: 8px; min-height: 190px; justify-content: center; }
.choice svg { width: clamp(80px, 16vw, 130px); height: clamp(80px, 16vw, 130px); }
.choice .name { font-family: var(--font-display); font-size: 28px; }
.choice:hover:not(:disabled) { border-color: var(--focus); }
.choice:disabled { cursor: default; }
.choice.no { opacity: .3; }
.choice.yes { border-color: var(--ok); background: var(--ok-soft); }

/* 피드백 (높이 고정: 화면이 흔들리지 않게) */
.fb { min-height: 96px; display: flex; align-items: center; justify-content: center; gap: 16px; flex-wrap: wrap; text-align: center; }
.fb .msg { font-family: var(--font-display); font-size: clamp(24px, 3.6vw, 32px); }
.fb .msg.try { color: var(--ink); background: var(--hint); padding: 10px 20px; border-radius: 14px; }
.fb .msg.good { color: var(--ok); }
.big { font-family: var(--font-display); font-size: 26px; padding: 16px 32px; border-radius: 16px; border: none; background: var(--ink); color: var(--surface); display: inline-flex; align-items: center; gap: 10px; }
.big svg { width: 26px; height: 26px; }

/* 시작/끝 화면 */
.card { background: var(--surface); border-radius: 20px; padding: 32px 24px; display: flex; flex-direction: column; align-items: center; gap: 20px; text-align: center; }
.card h1 { font-family: var(--font-display); font-weight: 400; font-size: clamp(34px, 6vw, 48px); margin: 0; text-wrap: balance; }
.preview { display: flex; gap: 10px; }
.preview svg { width: 56px; height: 56px; }
.teacher { max-width: 62ch; font-size: 15px; line-height: 1.7; color: var(--muted); border-top: 1px solid var(--line); padding-top: 16px; text-align: left; }
.teacher b { color: var(--ink); }
.rec { border-collapse: collapse; font-size: 15px; width: 100%; max-width: 560px; }
.rec th, .rec td { border-bottom: 1px solid var(--line); padding: 8px 10px; text-align: left; }
.rec th { color: var(--muted); font-weight: 500; }
.rec td.n { font-variant-numeric: tabular-nums; }
.rec .mini { display: inline-flex; gap: 3px; vertical-align: middle; }
.rec .mini svg { width: 20px; height: 20px; }
.rec .qm { width: 20px; height: 20px; display: inline-grid; place-items: center; border: 2px dashed var(--muted); border-radius: 4px; font-size: 12px; color: var(--muted); box-sizing: border-box; }
.tbl { overflow-x: auto; width: 100%; display: flex; justify-content: center; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
@media (max-width: 480px) { .choice { min-height: 150px; } .task { padding: 12px; } }
</style>
</head>
<body>

<div class="app" id="app"></div>
<div class="sr" aria-live="polite" id="live"></div>

<script>
(function () {
  const SHAPES = {
    circle: { name: "동그라미", svg: c => `<svg viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="50" r="42" fill="var(--circle)"/></svg>` },
    square: { name: "네모", svg: c => `<svg viewBox="0 0 100 100" aria-hidden="true"><rect x="10" y="10" width="80" height="80" rx="8" fill="var(--square)"/></svg>` },
    tri:    { name: "세모", svg: c => `<svg viewBox="0 0 100 100" aria-hidden="true"><path d="M50 8 L94 88 L6 88 Z" fill="var(--tri)" stroke-linejoin="round"/></svg>` }
  };
  const ICON = {
    starOn: `<svg viewBox="0 0 48 48" aria-hidden="true"><path d="M24 4l6 12.6 13.8 1.8-10 9.6 2.5 13.7L24 35.2 11.7 41.7l2.5-13.7-10-9.6L18 16.6z" fill="var(--star)"/></svg>`,
    starOff: `<svg viewBox="0 0 48 48" aria-hidden="true"><path d="M24 4l6 12.6 13.8 1.8-10 9.6 2.5 13.7L24 35.2 11.7 41.7l2.5-13.7-10-9.6L18 16.6z" fill="var(--star-empty)"/></svg>`,
    soundOn: `<svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M16 9a4 4 0 0 1 0 6"/><path d="M18.5 6.5a7.5 7.5 0 0 1 0 11"/></svg>`,
    soundOff: `<svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M17 10l4 4M21 10l-4 4"/></svg>`,
    hand: `<svg viewBox="0 0 48 48" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M18 26V9a3 3 0 0 1 6 0v13"/><path d="M24 21v-3a3 3 0 0 1 6 0v5"/><path d="M30 22a3 3 0 0 1 6 0v8c0 7-5 12-12 12h-1c-5 0-8-3-10-7l-4-8a3 3 0 0 1 5-3l3 4"/></svg>`,
    eye: `<svg viewBox="0 0 48 48" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M3 24s8-13 21-13 21 13 21 13-8 13-21 13S3 24 3 24z"/><circle cx="24" cy="24" r="6"/></svg>`,
    point: `<svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h12M13 6l6 6-6 6"/></svg>`,
    again: `<svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12a8 8 0 1 0 3-6.2"/><path d="M4 4v5h5"/></svg>`
  };
  const TOTAL = 3;
  const app = document.getElementById("app");
  const live = document.getElementById("live");

  let soundOn = false;
  try { soundOn = localStorage.getItem("shape-sound") === "on"; } catch (e) {}
  let actx = null;
  let readTimer = null;
  let state = null;

  // ---------- 소리 (기본 꺼짐) ----------
  function chime(ok) {
    if (!soundOn) return;
    try {
      actx = actx || new (window.AudioContext || window.webkitAudioContext)();
      const notes = ok ? [523, 659] : [392];
      notes.forEach((f, i) => {
        const o = actx.createOscillator(), g = actx.createGain();
        o.type = "sine"; o.frequency.value = f;
        const t = actx.currentTime + i * 0.16;
        g.gain.setValueAtTime(0.0001, t);
        g.gain.exponentialRampToValueAtTime(0.08, t + 0.02);
        g.gain.exponentialRampToValueAtTime(0.0001, t + 0.35);
        o.connect(g).connect(actx.destination); o.start(t); o.stop(t + 0.4);
      });
    } catch (e) {}
  }
  function speak(text) {
    if (!soundOn || !("speechSynthesis" in window)) return;
    try {
      speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.lang = "ko-KR"; u.rate = 0.8; u.volume = 0.7;
      speechSynthesis.speak(u);
    } catch (e) {}
  }
  function announce(t) { live.textContent = t; }

  // ---------- 규칙 ----------
  // unit: 반복되는 한 묶음, reps: ? 앞에 온전히 보여 줄 묶음 수.
  // 마지막 묶음도 끝까지 다 보여 주되, 그 묶음 안의 한 칸(첫·중간·끝 중 무작위)이 ?
  const RULES = {
    ab:   { label: "AB",   desc: "번갈아",      unit: [0, 1],       reps: 3 },
    aabb: { label: "AABB", desc: "두 개씩",     unit: [0, 0, 1, 1], reps: 2 },
    abb:  { label: "ABB",  desc: "하나, 두 개", unit: [0, 1, 1],    reps: 2 }
  };
  const MIX = ["ab", "aabb", "abb"]; // 섞기: 쉬운 것부터 하나씩
  let ruleChoice = "ab";
  try { const r = localStorage.getItem("shape-rule"); if (r && (RULES[r] || r === "mix")) ruleChoice = r; } catch (e) {}
  function unitMini(ruleKey, a, b) {
    return RULES[ruleKey].unit.map(u => SHAPES[u === 0 ? a : b].svg()).join("");
  }

  // ---------- 문제 만들기 ----------
  function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
  function makeSet() {
    const keys = Object.keys(SHAPES);
    const pairs = [];
    keys.forEach(a => keys.forEach(b => { if (a !== b) pairs.push([a, b]); }));
    shuffle(pairs);
    // 앞 모양(A)이 문제마다 바뀌도록 고름 → 같은 규칙을 다른 모양으로 일반화
    const picked = [];
    for (const p of pairs) { if (!picked.some(q => q[0] === p[0])) picked.push(p); if (picked.length === TOTAL) break; }
    return picked.map(([a, b], n) => {
      const rule = ruleChoice === "mix" ? MIX[n] : ruleChoice;
      const R = RULES[rule];
      const U = R.unit.length;
      const at = i => (R.unit[i % U] === 0 ? a : b);
      const seq = Array.from({ length: (R.reps + 1) * U }, (_, i) => at(i));
      const qpos = R.reps * U + Math.floor(Math.random() * U);
      return { rule, a, b, seq, qpos, answer: at(qpos), options: shuffle([a, b]), tries: 0, wrong: [] };
    });
  }

  // ---------- 화면 ----------
  function starsHTML() {
    let h = `<span class="lbl">별</span>`;
    for (let i = 0; i < TOTAL; i++) h += i < state.stars ? ICON.starOn : ICON.starOff;
    return `<div class="stars" role="img" aria-label="별 ${state.stars}개 / ${TOTAL}개">${h}</div>`;
  }
  function soundBtn() {
    return `<button class="sound" id="soundBtn" aria-pressed="${soundOn}">${soundOn ? ICON.soundOn : ICON.soundOff}<span>소리 ${soundOn ? "켜짐" : "꺼짐"}</span></button>`;
  }
  function topBar() { return `<div class="top">${state ? starsHTML() : "<span></span>"}${soundBtn()}</div>`; }
  function bindSound() {
    document.getElementById("soundBtn").onclick = () => {
      soundOn = !soundOn;
      try { localStorage.setItem("shape-sound", soundOn ? "on" : "off"); } catch (e) {}
      if (!soundOn && "speechSynthesis" in window) speechSynthesis.cancel();
      const b = document.getElementById("soundBtn");
      b.setAttribute("aria-pressed", soundOn);
      b.innerHTML = `${soundOn ? ICON.soundOn : ICON.soundOff}<span>소리 ${soundOn ? "켜짐" : "꺼짐"}</span>`;
    };
  }

  function renderStart() {
    stopRead();
    state = null;
    app.innerHTML = `
      ${topBar()}
      <section class="card">
        <h1>? 에 들어갈 모양을 찾아요</h1>
        <div class="preview">${SHAPES.circle.svg()}${SHAPES.square.svg()}${SHAPES.circle.svg()}${SHAPES.square.svg()}</div>
        <span class="pickLbl">규칙 고르기 (함께 하는 분이 골라 주세요)</span>
        <div class="rules" role="group" aria-label="규칙 고르기">
          ${Object.keys(RULES).map(k => `
            <button class="ruleBtn" data-r="${k}" aria-pressed="${ruleChoice === k}">
              <span class="mini">${unitMini(k, "circle", "square")}</span>
              <span class="nm">${RULES[k].label}</span><span class="ds">${RULES[k].desc}</span>
            </button>`).join("")}
          <button class="ruleBtn" data-r="mix" aria-pressed="${ruleChoice === "mix"}">
            <span class="mini">${SHAPES.circle.svg()}${SHAPES.square.svg()}${SHAPES.tri.svg()}</span>
            <span class="nm">섞기</span><span class="ds">AB → AABB → ABB</span>
          </button>
        </div>
        <button class="big" id="startBtn">시작 ${ICON.point}</button>
        <div class="teacher">
          <b>함께 하는 분께</b><br>
          문제는 3개입니다. 한 번에 한 규칙만 연습하고, <b>섞기</b>를 고르면 AB, AABB, ABB가 한 문제씩 쉬운 순서로 나옵니다.<br>
          모양 줄은 규칙 묶음(AB, AABB, ABB)이 끝까지 다 나옵니다. 물음표는 마지막 묶음 안의 한 칸(처음·중간·끝)에 나옵니다.<br>
          묶음마다 조금 띄워서 보여 줍니다. 묶음을 손으로 감싸며 보여 주세요.<br>
          문제가 나오면 <b>모양 읽기</b>를 눌러 "동그라미, 동그라미, 네모, 네모…" 하고 손가락으로 함께 짚어 주세요.<br>
          틀리면 다시 고를 기회가 한 번 있고, 앞 묶음에서 같은 자리의 모양이 강조됩니다. 끝 화면에 문제별 기록이 나옵니다.<br>
          소리는 꺼져 있습니다. 오른쪽 위 버튼으로 켤 수 있습니다.
        </div>
      </section>`;
    bindSound();
    app.querySelectorAll(".ruleBtn").forEach(btn => btn.onclick = () => {
      ruleChoice = btn.dataset.r;
      try { localStorage.setItem("shape-rule", ruleChoice); } catch (e) {}
      app.querySelectorAll(".ruleBtn").forEach(x => x.setAttribute("aria-pressed", x === btn));
    });
    document.getElementById("startBtn").onclick = () => {
      state = { qs: makeSet(), i: 0, stars: 0 };
      renderQ();
    };
  }

  function renderQ() {
    stopRead();
    const q = state.qs[state.i];
    const done = q.done;
    const U = RULES[q.rule].unit.length;
    const us = idx => (idx > 0 && idx % U === 0 ? " unit-start" : "");
    const cells = q.seq.map((k, idx) => idx === q.qpos
      ? `<div class="cell q${us(idx)} ${done ? "filled" : ""}" id="qcell" data-idx="${idx}" role="img" aria-label="${done ? SHAPES[k].name : "물음표"}">${done ? SHAPES[k].svg() : "?"}</div>`
      : `<div class="cell${us(idx)}" data-idx="${idx}" role="img" aria-label="${SHAPES[k].name}">${SHAPES[k].svg()}</div>`).join("");

    const choices = q.options.map((k, n) => {
      const isNo = q.wrong.includes(k);
      const isYes = done && k === q.answer;
      return `<button class="choice ${isNo ? "no" : ""} ${isYes ? "yes" : ""}" data-k="${k}" ${isNo || done ? "disabled" : ""} aria-label="${SHAPES[k].name}">
        ${SHAPES[k].svg()}<span class="name">${SHAPES[k].name}</span></button>`;
    }).join("");

    let fb = "";
    if (done) {
      const nextLabel = state.i + 1 < TOTAL ? `${state.i + 2}번 문제` : "끝내기";
      fb = `<span class="msg good">${goodText(q)}</span>
            <button class="big" id="nextBtn">${nextLabel} ${ICON.point}</button>`;
    } else if (q.wrong.length) {
      fb = `<span class="msg try">이 모양을 봐요. 다시 골라요.</span>`;
    }

    app.innerHTML = `
      ${topBar()}
      <div class="task">
        <span class="now">지금 할 일</span>
        ${done ? ICON.eye : ICON.hand}
        <span class="say">${done ? "잘했어요. 다음으로 가요." : "? 에 들어갈 모양을 골라요."}</span>
      </div>
      <section class="seq-wrap" aria-label="${state.i + 1}번 문제">
        <div class="seq">${cells}</div>
        <div class="rule"><span>규칙</span><span class="mini">${unitMini(q.rule, q.a, q.b)}</span><span>${RULES[q.rule].label}</span></div>
        <button class="read" id="readBtn">${ICON.soundOn}<span>모양 읽기</span></button>
      </section>
      <div class="choices">${choices}</div>
      <div class="fb">${fb}</div>`;

    bindSound();
    document.getElementById("readBtn").onclick = readAlong;
    app.querySelectorAll(".choice").forEach(b => b.onclick = () => pick(b.dataset.k));
    const nb = document.getElementById("nextBtn");
    if (nb) { nb.onclick = next; nb.focus(); }
    // 다시 고를 때: 앞 묶음에서 ?와 같은 자리의 모양(=정답 모양)을 강조
    if (!done && q.wrong.length) {
      app.querySelector(`.cell[data-idx="${q.qpos - U}"]`).classList.add("lit");
    }
  }
  function goodText(q) { return `맞아요! 여기는 ${SHAPES[q.answer].name}.`; }

  function pick(k) {
    const q = state.qs[state.i];
    if (q.done) return;
    q.tries++;
    if (k === q.answer) {
      q.done = true;
      state.stars++;
      chime(true);
      const t = goodText(q);
      speak(t); announce(t);
    } else {
      q.wrong.push(k);
      chime(false);
      const t = "이 모양을 봐요. 다시 골라요.";
      speak(t); announce(t);
    }
    renderQ();
  }

  function readAlong() {
    stopRead();
    const q = state.qs[state.i];
    const els = Array.from(app.querySelectorAll(".cell[data-idx]"));
    let i = 0;
    const step = () => {
      els.forEach(e => e.classList.remove("lit"));
      if (i < els.length) {
        els[i].classList.add("lit");
        speak(i === q.qpos && !q.done ? "무엇?" : SHAPES[q.seq[i]].name);
        i++;
        readTimer = setTimeout(step, 1100);
      }
    };
    step();
  }
  function stopRead() { if (readTimer) clearTimeout(readTimer); readTimer = null; }

  function next() {
    if (state.i + 1 < TOTAL) { state.i++; renderQ(); }
    else renderEnd();
  }

  function renderEnd() {
    stopRead();
    const first = state.qs.filter(q => q.tries === 1).length;
    const rows = state.qs.map((q, n) => `
      <tr><td class="n">${n + 1}</td>
      <td>${RULES[q.rule].label}</td>
      <td><span class="mini">${q.seq.map((k, idx) => idx === q.qpos ? `<span class="qm">?</span>` : SHAPES[k].svg()).join("")}</span></td>
      <td>${SHAPES[q.answer].name}</td>
      <td>${q.tries === 1 ? "처음에 맞힘" : "다시 골라서 맞힘"}</td></tr>`).join("");
    app.innerHTML = `
      ${topBar()}
      <section class="card">
        <h1>끝! 3문제를 다 했어요.</h1>
        <div class="stars" role="img" aria-label="별 ${state.stars}개">${ICON.starOn.repeat(state.stars)}</div>
        <button class="big" id="againBtn">${ICON.again} 다시 하기</button>
        <div class="teacher" style="width:100%">
          <b>기록</b> · 처음에 맞힌 문제 ${first} / ${TOTAL}
        </div>
        <div class="tbl">
          <table class="rec">
            <thead><tr><th>번호</th><th>규칙</th><th>모양 줄</th><th>정답</th><th>결과</th></tr></thead>
            <tbody>${rows}</tbody>
          </table>
        </div>
      </section>`;
    bindSound();
    const t = "끝! 3문제를 다 했어요.";
    speak(t); announce(t);
    document.getElementById("againBtn").onclick = renderStart;
  }

  renderStart();
})();
</script>

</body>
</html>
